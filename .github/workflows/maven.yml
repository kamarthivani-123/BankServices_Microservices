name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Account Service
        run: mvn -B package --file BankService-Microservices-main/account-service/pom.xml

      - name: Build Auth Service
        run: mvn -B package --file BankService-Microservices-main/auth-service/pom.xml

      - name: Build Transaction Service
        run: mvn -B package --file BankService-Microservices-main/transaction-service/pom.xml
