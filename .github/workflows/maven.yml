name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Account Service
        run: mvn -B package --file BankService-Microservices-main/account-service/pom.xml

      - name: Build Auth Service
        run: mvn -B package --file BankService-Microservices-main/auth-service/pom.xml

      - name: Build Transaction Service
        run: mvn -B package --file BankService-Microservices-main/transaction-service/pom.xml
      - name: Build Account Docker Image
        run: docker build -t account-service ./BankService-Microservices-main/account-service

      - name: Build Auth Docker Image
        run: docker build -t auth-service ./BankService-Microservices-main/auth-service

      - name: Build Transaction Docker Image
        run: docker build -t transaction-service ./BankService-Microservices-main/transaction-service
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Account Service Image
        run: |
          docker tag account-service ${{ secrets.DOCKER_USERNAME }}/account-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/account-service:latest

      - name: Push Auth Service Image
        run: |
          docker tag auth-service ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: Push Transaction Service Image
        run: |
          docker tag transaction-service ${{ secrets.DOCKER_USERNAME }}/transaction-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/transaction-service:latest
